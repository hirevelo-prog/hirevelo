<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Received | HireVelo Technologies</title>
<style>
:root{--purple:#6D28D9;--ink:#150F23;--grey:#5B5568;--lav:#F7F4FC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--lav);color:var(--ink);font-family:Inter,Arial,sans-serif}
.card{max-width:640px;margin:24px;padding:52px;border:1px solid #E4DEF0;border-radius:18px;background:#fff;text-align:center;box-shadow:0 18px 60px rgba(21,15,35,.08)}
.icon{width:64px;height:64px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:var(--purple);color:#fff;font-size:30px;font-weight:700}
h1{margin:0;font-size:38px;line-height:1.1}
p{margin:16px 0 0;color:var(--grey);font-size:17px;line-height:1.65}
a{display:inline-block;margin-top:28px;padding:14px 24px;border-radius:999px;background:var(--purple);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main class="card">
  <div class="icon">✓</div>
  <h1>Requirement received</h1>
  <p>Thank you for contacting HireVelo. We’ve received your recruitment requirement and will get in touch shortly to understand the role further.</p>
  <a href="/">Back to HireVelo</a>
</main>
</body>
</html>
